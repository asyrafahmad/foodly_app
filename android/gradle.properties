#org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true


# Gradle JVM settings
org.gradle.jvmargs=-Xmx4096M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Disable parallel execution if your PC has <16GB RAM
org.gradle.parallel=false

# Enable caching to speed up subsequent builds
org.gradle.caching=true

# Kotlin compiler memory (useful if you use Kotlin in Android module)
kotlin.daemon.jvm.options=-Xmx2048M

# Dart VM heap size (fixes "Out of memory" in kernel snapshot)
dart.vm.options=--old_gen_heap_size=4096
